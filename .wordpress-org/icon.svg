<?xml version="1.0" encoding="UTF-8"?>
<!--
  WP PostgreSQL Database — icon master

  The database cylinder. Every diagram of a datastore since the 1970s has used it, and this plugin replaces exactly that box.

  Palette — canonical copy lives in tests/assets/brand.ts. These values are
  repeated here only because SVG cannot import; if they ever disagree with that
  file, that file is right.

  Every stop is a Tailwind indigo. Indigo, which is as near PostgreSQL's own blue as an unaffiliated plugin should get.

  Rendered to PNG by tests/assets/wporg-brand.spec.ts — never hand-edit the
  PNGs. See .wordpress-org/BRAND.md.

  Author: Al Amin Ahamed
  License: GPL-2.0-or-later
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256"
     role="img" aria-label="WP PostgreSQL Database">
	<title>WP PostgreSQL Database</title>

	<defs>
		<linearGradient id="frame" x1="0%" y1="0%" x2="100%" y2="100%">
			<stop offset="0%"   stop-color="#1e1b4b"/>
			<stop offset="40%"  stop-color="#312e81"/>
			<stop offset="78%"  stop-color="#4f46e5"/>
			<stop offset="100%" stop-color="#6366f1"/>
		</linearGradient>

		<radialGradient id="highlight" cx="22%" cy="18%" r="70%">
			<stop offset="0%"   stop-color="#818cf8" stop-opacity="0.30"/>
			<stop offset="55%"  stop-color="#4f46e5" stop-opacity="0.04"/>
			<stop offset="100%" stop-color="#1e1b4b" stop-opacity="0"/>
		</radialGradient>

		<linearGradient id="specular" x1="0%" y1="0%" x2="0%" y2="100%">
			<stop offset="0%"   stop-color="#ffffff" stop-opacity="0.10"/>
			<stop offset="34%"  stop-color="#ffffff" stop-opacity="0"/>
		</linearGradient>

		<radialGradient id="pool" cx="78%" cy="104%" r="72%">
			<stop offset="0%"   stop-color="#4f46e5" stop-opacity="0.38"/>
			<stop offset="64%"  stop-color="#4f46e5" stop-opacity="0"/>
		</radialGradient>

		<linearGradient id="glyph" x1="50%" y1="0%" x2="50%" y2="100%">
			<stop offset="0%"   stop-color="#ffffff"/>
			<stop offset="60%"  stop-color="#eef2ff"/>
			<stop offset="100%" stop-color="#c7d2fe"/>
		</linearGradient>
	</defs>

	<!-- Ground, highlight, refracted pool, specular sweep — the same stack
	     field() reproduces in CSS, so icon and banner catch the light alike. -->
	<rect width="256" height="256" rx="56" fill="url(#frame)"/>
	<rect width="256" height="256" rx="56" fill="url(#highlight)"/>
	<rect width="256" height="256" rx="56" fill="url(#pool)"/>
	<rect width="256" height="256" rx="56" fill="url(#specular)"/>

	<ellipse cx="128" cy="66" rx="82" ry="30" fill="url(#glyph)"/>
	<path d="M46 66 V190 a82 30 0 0 0 164 0 V66 a82 30 0 0 1 -164 0 Z" fill="url(#glyph)" opacity="0.9"/>
	<ellipse cx="128" cy="128" rx="82" ry="30" fill="none" stroke="#1e1b4b" stroke-width="12" opacity="0.55"/>
	<ellipse cx="128" cy="190" rx="82" ry="30" fill="none" stroke="#1e1b4b" stroke-width="12" opacity="0.35"/>
</svg>
